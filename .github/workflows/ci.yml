name: MultiOS CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-none
          - aarch64-unknown-none
          - riscv64gc-unknown-none-elf

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: ${{ matrix.target }}
        components: rust-src, llvm-tools

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check compilation
      run: cargo check --target ${{ matrix.target }} --workspace

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --target ${{ matrix.target }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-unknown-none
        components: rust-src, llvm-tools

    - name: Install bootimage
      run: cargo install bootimage

    - name: Build release
      run: cargo build --target x86_64-unknown-none --release

    - name: Create bootable image
      run: cargo bootimage --target x86_64-unknown-none

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: multios-boot-image
        path: target/x86_64-unknown-none/release/bootimage-multios-kernel.bin
