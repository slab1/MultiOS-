[build]
# Default target for cross-compilation
default-target = "x86_64-unknown-none"  # Fixed: was linux-gnu, must be bare metal

# Target-specific linker configurations
[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--script=kernel/src/arch/x86_64/linker.ld",
    "-C", "link-arg=-nostartfiles",
]

[target.aarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--script=kernel/src/arch/aarch64/linker.ld",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--script=kernel/src/arch/riscv64/linker.ld",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
]

# Global rustflags
[unstable]
# Uncomment when using `cargo build -Z build-std`:
# build-std = ["core", "compiler_builtins", "alloc"]
